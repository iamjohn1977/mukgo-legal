<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b8f34f">
  <meta name="color-scheme" content="light dark">
  <title>매일 새로운 은혜</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span id="appName">매일 새로운 은혜</span></div>
      <div class="top-actions">
        <button class="icon-button" id="settingsButton" type="button" aria-label="설정"><span>⚙</span></button>
        <button class="icon-button" id="accountButton" type="button" aria-label="로그인 및 등록"><span id="accountIcon">♙</span><strong id="accountLabel">로그인</strong></button>
        <button class="icon-button" id="languageButton" type="button" aria-label="언어 선택"><span>◎</span><strong id="languageShort">KO</strong></button>
      </div>
    </header>

    <section class="view" id="view-home">
      <section class="hero">
        <p class="date" id="date"></p>
        <p class="new-day" id="newDay"></p>
        <div class="quote-mark">”</div>
        <h1 id="verse"></h1>
        <p class="reference" id="reference"></p>
        <p class="note" id="note"></p>
        <p class="attribution" id="verseAttribution"></p>
      </section>

      <button class="hymn-card" id="hymnButton" type="button">
        <span class="play-circle" id="playIcon">▶</span>
        <span class="hymn-copy"><small id="hymnLabel">오늘의 찬송</small><strong id="hymn"></strong><span id="hymnSub"></span></span>
        <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <p class="play-status" id="playStatus" aria-live="polite"></p>

      <section class="prayer-card">
        <p class="eyebrow" id="prayerTitle">오늘의 작은 기도</p>
        <p class="prayer" id="prayer"></p>
      </section>

      <button class="video-card" id="videoCard" type="button">
        <span class="video-thumb" aria-hidden="true">▶</span>
        <span class="video-copy">
          <small id="videoEyebrow">오늘의 영상 말씀</small>
          <strong id="videoTitle">매일 새로운 은혜의 말씀</strong>
          <span id="videoSub">유튜브에서 이어서 보기</span>
        </span>
        <span class="video-go" aria-hidden="true">↗</span>
      </button>

      <section class="quick-grid" aria-label="주요 기능">
        <button type="button" data-feature="word"><span>☀</span><strong id="qWord">매일의 말씀</strong></button>
        <button type="button" data-feature="people"><span>☗</span><strong id="qPeople">성경 인물</strong></button>
        <button type="button" data-feature="study"><span>▤</span><strong id="qStudy">성경 공부</strong></button>
        <button type="button" data-feature="reflection"><span>♡</span><strong id="qReflection">묵상과 기도</strong></button>
        <button type="button" data-feature="hymns"><span>♫</span><strong id="qHymns">찬송가</strong></button>
        <button type="button" data-feature="share"><span>↗</span><strong id="qShare">말씀 공유</strong></button>
      </section>

      <section class="faith-card">
        <p class="eyebrow" id="faithEyebrow">우리가 따르는 신앙</p>
        <h2 id="faithTitle">성경 중심의 개혁주의 신학</h2>
        <p id="faithBody">하나님의 주권과 은혜, 오직 성경·오직 그리스도·오직 믿음을 고백합니다.</p>
      </section>

      <footer><span id="closing"></span><small id="footNote">Offline daily grace</small></footer>
    </section>

    <section class="view" id="view-people" hidden>
      <div class="view-head">
        <h2 id="peopleTitle">성경 인물</h2>
        <p id="peopleIntro">성경은 영웅담이 아닙니다. 여기 있는 사람들은 우리와 똑같이 은혜가 필요했던 사람들입니다.</p>
      </div>
      <div class="person-list" id="personList"></div>
    </section>

    <section class="view" id="view-study" hidden>
      <div class="view-head">
        <h2 id="studyTitle">성경 공부</h2>
        <p id="studyIntro">한 번에 한 걸음씩. 각 과는 본문과 짧은 해설, 그리고 두 개의 질문으로 이루어집니다.</p>
      </div>
      <div class="course-list" id="courseList"></div>
    </section>
  </main>

  <div class="sheet-backdrop" id="detailSheet" hidden>
    <section class="sheet tall">
      <div class="sheet-head"><h2 id="detailTitle"></h2><button data-close="detailSheet" type="button" aria-label="닫기">×</button></div>
      <div id="detailContent"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="languageSheet" hidden>
    <section class="sheet">
      <div class="sheet-head"><h2 id="languageTitle">언어 선택</h2><button data-close="languageSheet" type="button" aria-label="닫기">×</button></div>
      <div class="language-list" id="languageList"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="settingsSheet" hidden>
    <section class="sheet tall">
      <div class="sheet-head"><h2 id="settingsTitle">설정</h2><button data-close="settingsSheet" type="button" aria-label="닫기">×</button></div>
      <div id="settingsContent"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="registrationSheet" hidden>
    <section class="sheet">
      <div class="sheet-head"><h2 id="registerTitle">로그인 및 선택 등록</h2><button data-close="registrationSheet" type="button" aria-label="닫기">×</button></div>
      <div class="account-state" id="accountState" hidden></div>
      <p id="registerIntro"></p>
      <label class="field"><span id="nameLabel">이름 또는 고유 이름</span><input id="displayName" autocomplete="name"></label>
      <label class="field"><span id="emailLabel">이메일</span><input id="email" type="email" autocomplete="email"></label>
      <button class="primary-button" id="saveRegistration" type="button">이 기기에서 로그인</button>
      <button class="signout-button" id="signOut" type="button" hidden>로그아웃</button>
      <p class="privacy-note" id="privacyNote"></p>
    </section>
  </div>

  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button type="button" data-view="home" class="active"><span>⌂</span><strong id="navHome">홈</strong></button>
    <button type="button" data-view="people"><span>☗</span><strong id="navPeople">인물</strong></button>
    <button type="button" data-view="study"><span>▤</span><strong id="navStudy">공부</strong></button>
    <button type="button" data-feature="reflection"><span>♡</span><strong id="navPrayer">기도</strong></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
